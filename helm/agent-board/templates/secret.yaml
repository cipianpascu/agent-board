{{- if not .Values.secrets.existingSecret -}}
{{- if or .Values.secrets.databaseUrl .Values.secrets.apiKeys -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-board.fullname" . }}
  labels:
    {{- include "agent-board.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKeys }}
  AGENTBOARD_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  {{- end }}
{{- end }}
{{- end }}
