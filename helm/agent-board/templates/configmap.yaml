apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-board.fullname" . }}
  labels:
    {{- include "agent-board.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: "3456"
  AGENTBOARD_STORE: "postgres"
  MIGRATIONS_DIR: "/app/migrations/postgres"
  MCP_PORT: "3457"
  MCP_ENABLED: {{ .Values.mcp.enabled | quote }}
  MCP_TRANSPORT: "http"
  OPENCLAW_HOOK_URL: {{ .Values.openclaw.hookUrl | quote }}
  {{- if .Values.openclaw.agentSessionMap }}
  OPENCLAW_AGENT_SESSION_MAP: {{ .Values.openclaw.agentSessionMap | quote }}
  {{- end }}
